<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />

  <!-- Robot Ears / Headphones -->
  <rect x="74" y="234" width="34" height="74" rx="16" fill="#f59e0b" />
  <rect x="404" y="234" width="34" height="74" rx="16" fill="#f59e0b" />

  <!-- Antenna Stem -->
  <rect x="246" y="96" width="20" height="60" rx="8" fill="#cbd5e1" />
  <!-- Sprout Leaves on top of Antenna -->
  <path d="M256 104 C236 70 200 68 196 90 C192 112 228 116 256 104 Z" fill="url(#sproutGrad)" />
  <path d="M256 104 C276 60 320 62 322 84 C324 106 284 114 256 104 Z" fill="#22c55e" />

  <!-- Robot Head Card -->
  <rect x="96" y="146" width="320" height="250" rx="64" fill="url(#headGrad)" filter="url(#softShadow)" />
  <rect x="96" y="146" width="320" height="250" rx="64" fill="none" stroke="#e2e8f0" stroke-width="6" />

  <!-- Screen / Visor -->
  <rect x="126" y="176" width="260" height="154" rx="42" fill="#0f172a" />

  <!-- Cheerful Eyes -->
  <!-- Left Eye -->
  <circle cx="190" cy="244" r="26" fill="#38bdf8" />
  <circle cx="182" cy="236" r="9" fill="#ffffff" />
  <!-- Right Eye -->
  <circle cx="322" cy="244" r="26" fill="#38bdf8" />
  <circle cx="314" cy="236" r="9" fill="#ffffff" />

  <!-- Cheeks -->
  <ellipse cx="152" cy="274" rx="16" ry="10" fill="#f472b6" opacity="0.85" />
  <ellipse cx="360" cy="274" rx="16" ry="10" fill="#f472b6" opacity="0.85" />

  <!-- Happy Smile -->
  <path d="M232 266 Q256 288 280 266" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />

  <!-- Code Badge on Chin: < / > -->
  <g transform="translate(220, 350)">
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#0ea5e9" text-anchor="middle">&lt; / &gt;</text>
  </g>
</svg>